<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f6f9;
      color: #333;
    }

    header {
      background: #003366;
      color: white;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header .logo { font-size: 24px; font-weight: bold; }
    header nav ul { list-style: none; display: flex; gap: 20px; margin: 0; padding: 0; }
    header nav ul li a { color: #fff; font-weight: 500; text-decoration: none; }

    h2 { text-align: center; margin-top: 30px; color: #003366; }

    .form-container {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border-radius: 8px;
    }

    .form-container input {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 10px 15px;
      font-size: 14px;
      margin-top: 5px;
    }

    #addProductBtn { background: #003366; color: white; width: 100%; }
    #addProductBtn:hover { background: #005599; }
    
    #loginBtn {
      background-color: #4CAF50; color: white; padding: 15px 20px;
      font-size: 25px; border: none; border-radius: 5px; cursor: pointer;
      transition: background-color 0.3s ease;
    }
    #loginBtn:hover { background-color: #022204; }

    #adminId, #adminPassword {
      padding: 8px; margin: 5px 0; width: 100%; font-size: 18px;
    }

    /* Admin Product List Styles */
    #productList {
      max-width: 1000px;
      margin: 40px auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 0 20px 40px;
    }

    .admin-product-card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      position: relative;
    }

    .admin-product-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    .admin-product-card h3 { font-size: 16px; margin: 5px 0; }
    .admin-product-card p { font-size: 14px; color: #555; margin-bottom: 10px; }
    
    .edit-input {
      width: 90%;
      padding: 5px;
      margin: 5px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      display: none;
    }

    .btn-edit { background: #ffc107; color: #333; }
    .btn-save { background: #28a745; color: white; display: none; }
    .btn-delete { background: #dc3545; color: white; margin-top: 10px; }
  </style>
</head>

<body>
  <header>
    <div class="logo">Kingstone Ventures</div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
      </ul>
    </nav>
  </header>

  <h2>Admin - Manage Products</h2>

  <div class="form-container">
   <input type="text" id="adminId" placeholder="Admin ID" />
   <input type="password" id="adminPassword" placeholder="Password" />
   <button id="loginBtn">🔐 Login</button>
  </div>
 
  <div id="admin" style="display: none;">
    <!-- Add Product Form -->
    <div class="form-container">
      <h3>Add New Product</h3>
      <input id="name" placeholder="Product Name" />
      <input id="price" type="number" placeholder="Price in Pesewas (e.g. 8500)" />
      <input type="file" id="imageFile" accept="image/*" />
      <button id="addProductBtn">Upload & Add Product</button>
    </div>

    <h3>Existing Products</h3>
    <div id="productList">
      <!-- Products will be rendered here dynamically -->
    </div>
  </div>

  <!-- Firebase Setup & Logic -->
  <script type="module">
    import { db, storage } from './scripts/firebase-config.js';
    import { collection, getDocs, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

    // --- LOGIN LOGIC ---
    const loginBtn = document.getElementById('loginBtn');
    const adminSection = document.getElementById('admin');

    loginBtn.addEventListener('click', () => {
      const id = document.getElementById('adminId').value;
      const pass = document.getElementById('adminPassword').value;
      
      // Simple hardcoded check for now.
      if (id === 'admin' && pass === 'password123') {
        adminSection.style.display = 'block';
        loadProducts(); // Load products only after login
      } else {
        alert('Incorrect Admin ID or Password');
      }
    });

    // --- ADD PRODUCT LOGIC ---
    document.getElementById('addProductBtn').addEventListener('click', async () => {
      const name = document.getElementById('name').value;
      const price = parseInt(document.getElementById('price').value);
      const file = document.getElementById('imageFile').files[0];

      if (!name || !price || !file) {
        alert("Please fill all fields and select an image.");
        return;
      }

      try {
        // 1. Upload image to Firebase Storage
        const storageRef = ref(storage, 'products/' + file.name);
        await uploadBytes(storageRef, file);
        const imageUrl = await getDownloadURL(storageRef);

        // 2. Save data to Firestore
        await addDoc(collection(db, "products"), {
          name: name,
          price: price,
          image: imageUrl
        });

        alert("Product added successfully!");
        // Clear form
        document.getElementById('name').value = '';
        document.getElementById('price').value = '';
        document.getElementById('imageFile').value = '';

      } catch (error) {
        console.error("Error adding product: ", error);
        alert("Failed to add product. Check console for errors.");
      }
    });

    // --- VIEW, EDIT, DELETE LOGIC ---
    const productList = document.getElementById('productList');

    function loadProducts() {
      // onSnapshot listens for real-time updates from Firestore
      onSnapshot(collection(db, "products"), (snapshot) => {
        productList.innerHTML = ''; // Clear current list
        
        snapshot.forEach((docSnapshot) => {
          const product = docSnapshot.data();
          const productId = docSnapshot.id;
          const priceInGhs = (product.price / 100).toFixed(2);

          const card = document.createElement('div');
          card.className = 'admin-product-card';
          card.innerHTML = `
            <img src="${product.image}" alt="${product.name}">
            <h3 class="view-name">${product.name}</h3>
            <input type="text" class="edit-name edit-input" value="${product.name}">
            
            <p class="view-price">GHS ${priceInGhs}</p>
            <input type="number" class="edit-price edit-input" value="${product.price}">

            <div style="margin-top: 10px;">
              <button class="btn-edit" data-id="${productId}">✏️ Edit</button>
              <button class="btn-save" data-id="${productId}">💾 Save</button>
              <button class="btn-delete" data-id="${productId}">🗑️ Delete</button>
            </div>
          `;
          productList.appendChild(card);
        });

        // Attach event listeners for Edit, Save, Delete
        attachEventListeners();
      });
    }

    function attachEventListeners() {
      // EDIT: Show inputs, hide text
      document.querySelectorAll('.btn-edit').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const card = e.target.closest('.admin-product-card');
          card.querySelector('.view-name').style.display = 'none';
          card.querySelector('.view-price').style.display = 'none';
          card.querySelector('.edit-name').style.display = 'block';
          card.querySelector('.edit-price').style.display = 'block';
          card.querySelector('.btn-save').style.display = 'inline-block';
          e.target.style.display = 'none'; // Hide edit button
        });
      });

      // SAVE: Update Firestore
      document.querySelectorAll('.btn-save').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.target.dataset.id;
          const card = e.target.closest('.admin-product-card');
          const newName = card.querySelector('.edit-name').value;
          const newPrice = parseInt(card.querySelector('.edit-price').value);

          try {
            await updateDoc(doc(db, "products", id), {
              name: newName,
              price: newPrice
            });
            alert("Product updated!");
            // onSnapshot will automatically refresh the UI back to view mode
          } catch (error) {
            console.error("Error updating: ", error);
          }
        });
      });

      // DELETE: Remove from Firestore
      document.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.target.dataset.id;
          if (confirm("Are you sure you want to delete this product?")) {
            try {
              await deleteDoc(doc(db, "products", id));
              alert("Product deleted.");
            } catch (error) {
              console.error("Error deleting: ", error);
            }
          }
        });
      });
    }
  </script>
</body>
</html>
